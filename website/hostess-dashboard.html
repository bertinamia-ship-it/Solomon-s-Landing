<!-- RES APP PAGE: hostess-dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostess Dashboard - Solomon's Landing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1e293b;
        }
        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .dashboard-header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .dashboard-header .logo-section img {
            height: 40px;
            width: auto;
        }
        .dashboard-header h1 {
            color: #004A9F;
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
        }
        .btn-logout {
            padding: 0.75rem 1.5rem;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-logout:hover { background: #b91c1c; }
        .controls-section {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls-row label {
            font-weight: 600;
            color: #374151;
        }
        .controls-row input,
        .controls-row select {
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .area-tabs {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .area-tab {
            padding: 0.75rem 1.5rem;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: #6b7280;
        }
        .area-tab.active {
            background: #004A9F;
            color: white;
        }
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 1200px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
        }
        .floor-plan-container {
            position: relative;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f9fafb;
            min-height: 600px;
            overflow: auto;
        }
        .floor-plan-canvas {
            position: relative;
            width: 100%;
            height: 600px;
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: auto;
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .table-node {
            position: absolute;
            user-select: none;
            cursor: pointer;
            z-index: 10;
            transition: transform 120ms ease, filter 120ms ease;
        }
        .table-node:hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.10));
            z-index: 100;
        }
        .table-shape {
            position: relative;
            border: 1.5px solid;
            background: linear-gradient(180deg, #f3f8ff 0%, #e8f1ff 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .table-shape.available {
            border-color: #10b981;
            background: linear-gradient(180deg, #d1fae5 0%, #ecfdf5 100%);
        }
        .table-shape.reserved {
            border-color: #3b82f6;
            background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%);
        }
        .table-shape.blocked {
            border-color: #f59e0b;
            background: linear-gradient(180deg, #fef3c7 0%, #fffbeb 100%);
        }
        .table-shape.unavailable {
            border-color: #ef4444;
            background: linear-gradient(180deg, #fee2e2 0%, #fef2f2 100%);
        }
        .table-number {
            font-weight: 700;
            color: #1d4ed8;
            font-size: 11px;
            line-height: 1;
            pointer-events: none;
        }
        .table-shape.available .table-number { color: #065f46; }
        .table-shape.reserved .table-number { color: #1e40af; }
        .table-shape.blocked .table-number { color: #92400e; }
        .table-shape.unavailable .table-number { color: #991b1b; }
        .seat {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #1d4ed8;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transform: translate(-50%, -50%);
            opacity: 0.85;
        }
        .table-shape.available .seat { background: #10b981; }
        .table-shape.reserved .seat { background: #3b82f6; }
        .table-shape.blocked .seat { background: #f59e0b; }
        .table-shape.unavailable .seat { background: #ef4444; }
        .status-legend {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .legend-color {
            width: 32px;
            height: 24px;
            border-radius: 6px;
            border: 1.5px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-color.available {
            background: linear-gradient(180deg, #d1fae5 0%, #ecfdf5 100%);
            border-color: #10b981;
        }
        .legend-color.reserved {
            background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%);
            border-color: #3b82f6;
        }
        .legend-color.blocked {
            background: linear-gradient(180deg, #fef3c7 0%, #fffbeb 100%);
            border-color: #f59e0b;
        }
        .legend-color.unavailable {
            background: linear-gradient(180deg, #fee2e2 0%, #fef2f2 100%);
            border-color: #ef4444;
        }
        .floor-object {
            position: absolute;
            background: #6b7280;
            border: 2px solid #4b5563;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .floor-object[data-object-type="entrance"] {
            background: #10b981;
            border-color: #059669;
        }
        .floor-object[data-object-type="bar"] {
            background: #8b5cf6;
            border-color: #7c3aed;
        }
        .object-label {
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .table-label {
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            color: #111827;
            font-weight: 700;
            pointer-events: none;
        }
        .reservations-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .reservation-item,
        .block-item {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .reservation-name {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .reservation-details {
            font-size: 0.9rem;
            color: #6b7280;
        }
        .reservation-table {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #004A9F;
            font-weight: 600;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn-primary {
            padding: 0.75rem 1.5rem;
            background: #004A9F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-primary:hover { background: #003d82; }
        .btn-secondary {
            padding: 0.75rem 1.5rem;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-secondary:hover { background: #4b5563; }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="logo-section">
                <img src="solomons-logo.png" alt="Solomon's Landing" onerror="this.style.display='none'">
                <h1>Hostess Dashboard</h1>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="controls-section">
            <div class="controls-row">
                <label>Date:</label>
                <input type="date" id="selectedDate" onchange="loadFloorPlan()">
                <label>Time:</label>
                <select id="selectedTime" onchange="loadFloorPlan()">
                    <option value="17:30">5:30 PM</option>
                    <option value="18:00">6:00 PM</option>
                    <option value="18:30">6:30 PM</option>
                    <option value="19:00">7:00 PM</option>
                    <option value="19:30">7:30 PM</option>
                    <option value="20:00">8:00 PM</option>
                    <option value="20:30">8:30 PM</option>
                    <option value="21:00">9:00 PM</option>
                    <option value="21:30">9:30 PM</option>
                </select>
            </div>
            <div class="area-tabs">
                <button class="area-tab active" onclick="switchArea('Main Floor')">Main Floor</button>
                <button class="area-tab" onclick="switchArea('Sushi Bar')">Sushi Bar</button>
            </div>
        </div>

        <div class="main-content">
            <!-- LEFT: Floor Plan -->
            <div class="section">
                <h2>Floor Plan</h2>
                <div class="status-legend">
                    <div class="legend-item">
                        <div class="legend-color available"></div>
                        <span>Available</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color reserved"></div>
                        <span>Reserved</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color blocked"></div>
                        <span>Blocked</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color unavailable"></div>
                        <span>Unavailable</span>
                    </div>
                </div>
                <div class="floor-plan-container">
                    <div id="floorPlanCanvas" class="floor-plan-canvas">
                        <div class="loading">Loading floor plan...</div>
                    </div>

            </div>

            <!-- RIGHT: Reservations & Blocks -->
            <div class="section">
                <h2>Reservations & Blocks</h2>
                <div id="reservationsList" class="reservations-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Action Modal -->
    <div id="tableModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Table Actions</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Reservation Details Modal -->
    <div id="reservationModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 id="reservationModalTitle">Reservation Details</h3>
            <div id="reservationModalBody"></div>
            <div class="modal-actions">
                <button class="btn-danger" onclick="cancelReservation()" style="margin-right: auto;">Cancel Reservation</button>
                <button class="btn-secondary" onclick="closeReservationModal()">Close</button>
                <button class="btn-primary" onclick="saveReservation()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Quick Add Reservation Modal -->
    <div id="quickAddModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <h3>Quick Add Reservation</h3>
            <div id="quickAddModalBody">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="quickAddName" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="quickAddPhone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="quickAddEmail">
                </div>
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="quickAddDate" required>
                </div>
                <div class="form-group">
                    <label>Time *</label>
                    <select id="quickAddTime" required>
                        <option value="17:30">5:30 PM</option>
                        <option value="18:00">6:00 PM</option>
                        <option value="18:30">6:30 PM</option>
                        <option value="19:00">7:00 PM</option>
                        <option value="19:30">7:30 PM</option>
                        <option value="20:00">8:00 PM</option>
                        <option value="20:30">8:30 PM</option>

                        <option value="21:30">9:30 PM</option>
                    </select>

                    <label>Party Size *</label>
                    <input type="number" id="quickAddPartySize" min="1" max="20" required>

                        <option value="phone">Phone</option>

                <button class="btn-primary" onclick="saveQuickAddReservation()">Create Reservation</button>

    <script>
        // Auth check
        const role = sessionStorage.getItem('dashboardRole');
        const token = sessionStorage.getItem('dashboardAuthToken');
        
        if (!role || !token || (role !== 'hostess' && role !== 'admin')) {
            window.location.href = 'dashboard-login.html';
        }

        // API helper
        async function api(path, opts = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...(opts.headers || {})
            };
            
            try {
                const response = await fetch(path, {
                    ...opts,
                    headers
                });
                
                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return null;
                }
                
                if (!response.ok) {
                    const text = await response.text();
                    console.error(`API error ${response.status} for ${path}:`, text.substring(0, 200));
                    return null;
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error(`Non-JSON response from ${path}:`, text.substring(0, 200));
                    return null;
                }
                
                return response;
            } catch (error) {
                console.error(`Fetch error for ${path}:`, error);
                return null;
            }
        }

        function logout() {
            sessionStorage.removeItem('dashboardRole');
            sessionStorage.removeItem('dashboardAuthToken');
            sessionStorage.removeItem('dashboardUsername');
            window.location.href = 'dashboard-login.html';
        }

        // State
        let currentArea = 'Main Floor';
        let allTables = [];
        let currentLayout = [];
        let assignments = [];
        let reservations = [];
        let selectedTableId = null;

        // Initialize
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('selectedDate').value = today;
        document.getElementById('selectedTime').value = '19:00';

        function switchArea(area) {
            currentArea = area;
            document.querySelectorAll('.area-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === area) tab.classList.add('active');
            });
            loadFloorPlan();
        }

        async function loadFloorPlan() {
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            if (!date || !time) return;
            
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '<div class="loading">Loading floor plan...</div>';
            
            try {
                // Load layout
                const layoutRes = await api(`/.netlify/functions/get-layout?area=${encodeURIComponent(currentArea)}`);
                if (!layoutRes) return;
                
                const layoutData = await layoutRes.json();
                currentLayout = layoutData.success && layoutData.layout?.layout_json ? layoutData.layout.layout_json : [];
                
                // Load tables
                const tablesRes = await api('/.netlify/functions/get-tables');
                if (!tablesRes) return;
                
                const tablesData = await tablesRes.json();
                allTables = (tablesData.all || []).filter(t => t.area === currentArea && t.is_active);
                
                // Load assignments for this date/time
                const assignmentsRes = await api(`/.netlify/functions/get-table-assignments?date=${date}&time=${time}`);
                if (!assignmentsRes) return;
                
                assignments = await assignmentsRes.json().catch(() => []);
                
                // Load reservations for this date (all times)
                const reservationsRes = await api(`/.netlify/functions/get-reservations?date=${date}`);
                if (!reservationsRes) return;
                
                reservations = await reservationsRes.json().catch(() => []);
                
                // Also load assignments for all times on this date to show table assignments
                const allAssignmentsRes = await api(`/.netlify/functions/get-table-assignments?date=${date}`);
                if (allAssignmentsRes) {
                    const allAssignments = await allAssignmentsRes.json().catch(() => []);
                    // Merge with time-specific assignments
                    assignments = [...assignments, ...allAssignments.filter(a => !assignments.some(ex => ex.id === a.id))];
                }
                
                renderFloorPlan();
                renderReservationsList();
            } catch (error) {
                canvas.innerHTML = `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        function getTableDimensions(seats) {
            // OpenTable-scale: much smaller tables
            if (seats === 2) return { w: 36, h: 28 };
            if (seats === 4) return { w: 48, h: 32 };
            if (seats === 6) return { w: 56, h: 36 };
            return { w: 48, h: 32 }; // Default
        }

        function getSeatPositions(seats, w, h) {
            const o = 6; // Smaller offset for smaller tables
            const cx = w / 2;
            const cy = h / 2;
            
            if (seats === 2) {
                return [
                    { x: -o, y: cy },
                    { x: w + o, y: cy }
                ];
            }
            
            if (seats === 4) {
                return [
                    { x: cx, y: -o },
                    { x: w + o, y: cy },
                    { x: cx, y: h + o },
                    { x: -o, y: cy }
                ];
            }
            
            // 6: 2 top, 2 bottom, 1 left, 1 right
            return [
                { x: cx - 8, y: -o },
                { x: cx + 8, y: -o },
                { x: w + o, y: cy },
                { x: cx + 8, y: h + o },
                { x: cx - 8, y: h + o },
                { x: -o, y: cy }
            ];
        }

        function renderFloorPlan() {
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '';
            
            const selectedTime = document.getElementById('selectedTime').value;
            
            // Helper to determine table status based on 3-slot system
            function getTableStatus(tableId) {
                // Check assignments for this table at selected time and its 3 slots (T, T+30, T+60)
                if (!selectedTime) return 'available';
                
                // Calculate the 3 time slots for a 90-minute reservation
                const [hours, minutes] = selectedTime.split(':').map(Number);
                const timeSlots = [selectedTime];
                
                // T+30: add 30 minutes
                let nextMinutes = minutes + 30;
                let nextHours = hours;
                if (nextMinutes >= 60) {
                    nextMinutes -= 60;
                    nextHours = (nextHours + 1) % 24;
                }
                timeSlots.push(`${String(nextHours).padStart(2, '0')}:${String(nextMinutes).padStart(2, '0')}`);
                
                // T+60: add 60 minutes total
                nextMinutes = minutes + 60;
                nextHours = hours;
                if (nextMinutes >= 60) {
                    nextMinutes -= 60;
                    nextHours = (nextHours + 1) % 24;
                }
                timeSlots.push(`${String(nextHours).padStart(2, '0')}:${String(nextMinutes).padStart(2, '0')}`);
                
                // Find any assignment for this table at any of the 3 slots
                const relevantAssignments = assignments.filter(a => 
                    a.table_id === tableId && 
                    timeSlots.includes(a.time) &&
                    ['reserved', 'blocked', 'unavailable'].includes(a.status)
                );
                
                if (relevantAssignments.length === 0) return 'available';
                
                // Priority: unavailable > blocked > reserved
                if (relevantAssignments.some(a => a.status === 'unavailable')) return 'unavailable';
                if (relevantAssignments.some(a => a.status === 'blocked')) return 'blocked';
                if (relevantAssignments.some(a => a.status === 'reserved')) return 'reserved';
                
                return 'available';
            }
            
            // Iterate through layout (same as admin)
            currentLayout.forEach((layoutItem, index) => {
                // Handle non-table objects (Entrance, Bar)
                if (layoutItem.type && (layoutItem.type === 'entrance' || layoutItem.type === 'bar')) {
                    const x = layoutItem.x || 50;
                    const y = layoutItem.y || 50;
                    const w = layoutItem.w || (layoutItem.type === 'entrance' ? 120 : 200);
                    const h = layoutItem.h || (layoutItem.type === 'entrance' ? 40 : 60);
                    
                    const node = document.createElement('div');
                    node.className = 'floor-object';
                    node.dataset.objectType = layoutItem.type;
                    node.dataset.layoutIndex = index;
                    node.style.left = `${x}px`;
                    node.style.top = `${y}px`;
                    node.style.width = `${w}px`;
                    node.style.height = `${h}px`;
                    
                    const label = document.createElement('div');
                    label.className = 'object-label';
                    label.textContent = layoutItem.type.charAt(0).toUpperCase() + layoutItem.type.slice(1);
                    node.appendChild(label);
                    
                    canvas.appendChild(node);
                    return;
                }
                
                // Handle tables
                const table = allTables.find(t => t.id === layoutItem.table_id);
                if (!table) return;
                
                const x = layoutItem.x || 50;
                const y = layoutItem.y || 50;
                const rotation = layoutItem.rotation || 0;
                
                // Get base dimensions
                const baseDims = getTableDimensions(table.seats);
                let renderW = baseDims.w;
                let renderH = baseDims.h;
                
                // Swap dimensions if rotated 90 degrees
                if (rotation === 90) {
                    renderW = baseDims.h;
                    renderH = baseDims.w;
                }
                
                // Determine status using 3-slot system
                const status = getTableStatus(table.id);
                
                // Find assignment for modal (use first relevant one)
                const assignment = assignments.find(a => 
                    a.table_id === table.id && 
                    ['reserved', 'blocked', 'unavailable'].includes(a.status)
                );
                
                const node = document.createElement('div');
                node.className = 'table-node';
                node.dataset.tableId = table.id;
                node.dataset.layoutIndex = index;
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                
                // Table shape
                const shape = document.createElement('div');
                shape.className = `table-shape ${status}`;
                shape.style.width = `${renderW}px`;
                shape.style.height = `${renderH}px`;
                
                // Table number (centered)
                const tableNumber = document.createElement('div');
                tableNumber.className = 'table-number';
                tableNumber.textContent = table.table_number || table.name || '?';
                shape.appendChild(tableNumber);
                
                // Calculate seat positions using render dimensions
                const seats = getSeatPositions(table.seats, renderW, renderH);
                
                // Create seats
                seats.forEach(pos => {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.style.left = `${pos.x}px`;
                    seat.style.top = `${pos.y}px`;
                    shape.appendChild(seat);
                });
                
                node.appendChild(shape);
                
                // Label (optional, shows name if different from number)
                if (table.name && table.name !== `Table ${table.table_number}`) {
                    const label = document.createElement('div');
                    label.className = 'table-label';
                    label.textContent = table.name;
                    node.appendChild(label);
                }
                
                node.title = `${table.name || `Table ${table.table_number}`} (${table.seats} seats) - ${status}`;
                node.addEventListener('click', () => openTableModal(table, assignment));
                
                canvas.appendChild(node);
            });
        }

        function renderReservationsList() {
            const container = document.getElementById('reservationsList');
            const time = document.getElementById('selectedTime').value;
            const date = document.getElementById('selectedDate').value;
            
            // Show all reservations for the date, filter by time if needed
            const dateReservations = reservations.filter(r => r.date === date && r.status !== 'cancelled');
            const timeReservations = time ? dateReservations.filter(r => r.time === time) : dateReservations;
            const timeAssignments = assignments.filter(a => a.time === time);
            const blocks = timeAssignments.filter(a => a.status === 'blocked' || a.status === 'unavailable');
            
            let html = '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;"><h3 style="margin: 0; font-size: 1.1rem;">Reservations</h3><button class="btn-primary btn-small" onclick="openQuickAddModal()" style="padding: 0.5rem 1rem; font-size: 0.9rem;">+ Quick Add</button></div>';
            
            if (timeReservations.length === 0) {
                html += '<div class="loading">No reservations for this ' + (time ? 'time slot' : 'date') + '</div>';
            } else {
                timeReservations.forEach(res => {
                    const resAssignments = assignments.filter(a => a.reservation_id === res.id);
                    const statusColor = res.status === 'confirmed' ? '#10b981' : res.status === 'pending' ? '#f59e0b' : '#6b7280';
                    const statusText = res.status.charAt(0).toUpperCase() + res.status.slice(1);
                    
                    html += `
                        <div class="reservation-item" style="cursor: pointer;" onclick="openReservationModal('${res.id}')">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div style="flex: 1;">
                                    <div class="reservation-name">${res.name || res.full_name || 'Guest'}</div>
                                    <div class="reservation-details">${res.party_size} guests • ${res.time} • <span style="color: ${statusColor}; font-weight: 600;">${statusText}</span></div>
                                    ${resAssignments.length > 0 ? `<div class="reservation-table">Tables: ${resAssignments.map(a => a.table_name || a.table_number || 'N/A').join(', ')}</div>` : '<div class="reservation-table" style="color: #dc2626;">No table assigned</div>'}
                                    ${res.confirmation_code ? `<div style="font-size: 0.85rem; color: #6b7280; margin-top: 0.25rem;">Code: ${res.confirmation_code}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            
            if (time) {
                html += '<h3 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem;">Blocks</h3>';
                
                if (blocks.length === 0) {
                    html += '<div class="loading">No blocks for this time slot</div>';
                } else {
                    blocks.forEach(block => {
                        const table = allTables.find(t => t.id === block.table_id);
                        html += `
                            <div class="block-item">
                                <div class="reservation-name">${table?.name || `Table ${block.table_number}`}</div>
                                <div class="reservation-details">${block.status} • ${block.notes || 'No notes'}</div>
                            </div>
                        `;
                    });
                }
            }
            
            container.innerHTML = html;
        }

        function openTableModal(table, assignment) {
            selectedTableId = table.id;
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modal = document.getElementById('tableModal');
            
            modalTitle.textContent = `${table.name || `Table ${table.table_number}`} (${table.seats} seats)`;
            
            let html = '';
            
            if (assignment) {
                html += `<div class="message">Current status: <strong>${assignment.status}</strong></div>`;
            }
            
            html += `
                <div class="form-group">
                    <label>Action:</label>
                    <select id="tableAction" onchange="updateActionForm()">
                        <option value="assign">Assign Reservation</option>
                        <option value="block">Quick Block</option>
                        <option value="unavailable">Mark Unavailable</option>
                        ${assignment ? '<option value="release">Release</option>' : ''}
                    </select>
                </div>
                <div id="actionForm"></div>
            `;
            
            modalBody.innerHTML = html;
            updateActionForm();
            modal.classList.add('active');
        }

        function updateActionForm() {
            const action = document.getElementById('tableAction').value;
            const form = document.getElementById('actionForm');
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            let html = '';
            
            if (action === 'assign') {
                const unassigned = reservations.filter(r => {
                    if (r.time !== time) return false;
                    return !assignments.some(a => a.reservation_id === r.id);
                });
                
                if (unassigned.length === 0) {
                    html = '<div class="message error">No unassigned reservations for this time slot</div>';
                } else {
                    html = `
                        <div class="form-group">
                            <label>Select Reservation:</label>
                            <select id="reservationSelect">
                                ${unassigned.map(r => `<option value="${r.id}">${r.name || r.full_name || 'Guest'} - ${r.party_size} guests</option>`).join('')}
                            </select>
                        </div>
                        <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Assign</button>
                    `;
                }
            } else if (action === 'block') {
                html = `
                    <div class="form-group">
                        <label>Reason (default: OpenTable):</label>
                        <input type="text" id="blockReason" value="OpenTable" placeholder="OpenTable">
                    </div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Block Table</button>
                `;
            } else if (action === 'unavailable') {
                html = `
                    <div class="message">Mark this table as unavailable for this time slot?</div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Mark Unavailable</button>
                `;
            } else if (action === 'release') {
                html = `
                    <div class="message">Release this table assignment?</div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Release</button>
                `;
            }
            
            form.innerHTML = html;
        }

        async function executeTableAction() {
            const action = document.getElementById('tableAction').value;
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            try {
                if (action === 'release') {
                    const assignment = assignments.find(a => a.table_id === selectedTableId && a.time === time);
                    if (!assignment) {
                        alert('No assignment found to release');
                        return;
                    }
                    
                    const res = await api('/.netlify/functions/release-assignment', {
                        method: 'POST',
                        body: JSON.stringify({ id: assignment.id })
                    });
                    
                    if (!res) return;
                    
                    const data = await res.json();
                    if (data.success) {
                        alert('Table released successfully');
                        closeModal();
                        loadFloorPlan();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                } else {
                    let payload = {
                        table_id: selectedTableId,
                        date: date,
                        time: time,
                        status: action === 'assign' ? 'reserved' : action === 'block' ? 'blocked' : 'unavailable'
                    };
                    
                    if (action === 'assign') {
                        const reservationId = document.getElementById('reservationSelect').value;
                        payload.reservation_id = reservationId;
                    }
                    
                    if (action === 'block') {
                        payload.notes = document.getElementById('blockReason').value || 'OpenTable';
                    }
                    
                    const res = await api('/.netlify/functions/set-assignment', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res) return;
                    
                    const data = await res.json();
                    if (data.success) {
                        alert('Action completed successfully');
                        closeModal();
                        loadFloorPlan();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function closeModal() {
            document.getElementById('tableModal').classList.remove('active');
            selectedTableId = null;
        }

        // Close modal on outside click
        document.getElementById('tableModal').addEventListener('click', (e) => {
            if (e.target.id === 'tableModal') closeModal();
        });
        document.getElementById('reservationModal').addEventListener('click', (e) => {
            if (e.target.id === 'reservationModal') closeReservationModal();
        });
        document.getElementById('quickAddModal').addEventListener('click', (e) => {
            if (e.target.id === 'quickAddModal') closeQuickAddModal();
        });

        // Reservation Modal Functions
        async function openReservationModal(reservationId) {
            const reservation = reservations.find(r => r.id === reservationId);
            if (!reservation) {
                alert('Reservation not found');
                return;
            }

            const resAssignments = assignments.filter(a => a.reservation_id === reservationId);
            const assignedTables = resAssignments.map(a => {
                const table = allTables.find(t => t.id === a.table_id);
                return table ? { id: table.id, name: table.name || `Table ${table.table_number}`, seats: table.seats } : null;
            }).filter(t => t !== null);

            const modalTitle = document.getElementById('reservationModalTitle');
            const modalBody = document.getElementById('reservationModalBody');
            const modal = document.getElementById('reservationModal');

            modalTitle.textContent = `Reservation: ${reservation.name || reservation.full_name || 'Guest'}`;

            const statusColor = reservation.status === 'confirmed' ? '#10b981' : reservation.status === 'pending' ? '#f59e0b' : '#6b7280';
            
            let html = `
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editName" value="${reservation.name || reservation.full_name || ''}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="editPhone" value="${reservation.phone || ''}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" value="${reservation.email || ''}" style="background: #f9fafb;" readonly>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="editDate" value="${reservation.date}" style="background: #f9fafb;" readonly>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <select id="editTime">
                        ${['17:30', '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30'].map(t => 
                            `<option value="${t}" ${t === reservation.time ? 'selected' : ''}>${t}</option>`
                        ).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>Party Size</label>
                    <input type="number" id="editPartySize" value="${reservation.party_size}" min="1" max="20">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="pending" ${reservation.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="confirmed" ${reservation.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                        <option value="cancelled" ${reservation.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assigned Tables</label>
                    <select id="editTables" multiple style="min-height: 100px;">
                        ${allTables.filter(t => t.area === currentArea && t.is_active).map(table => {
                            const isAssigned = assignedTables.some(at => at.id === table.id);
                            return `<option value="${table.id}" ${isAssigned ? 'selected' : ''}>${table.name || `Table ${table.table_number}`} (${table.seats} seats)</option>`;
                        }).join('')}
                    </select>
                    <small style="color: #6b7280;">Hold Ctrl/Cmd to select multiple tables</small>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="editNotes" rows="3">${reservation.notes || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>Confirmation Code</label>
                    <input type="text" value="${reservation.confirmation_code || 'N/A'}" style="background: #f9fafb;" readonly>
                </div>
                <div class="form-group">
                    <label>Source</label>
                    <input type="text" value="${reservation.source || 'web'}" style="background: #f9fafb;" readonly>
                </div>
                ${reservation.staying_place ? `<div class="form-group"><label>Staying</label><input type="text" value="${reservation.staying_place}" style="background: #f9fafb;" readonly></div>` : ''}
            `;

            modalBody.innerHTML = html;
            modal.classList.add('active');
            
            // Store reservation ID for save
            modal.dataset.reservationId = reservationId;
        }

        async function saveReservation() {
            const modal = document.getElementById('reservationModal');
            const reservationId = modal.dataset.reservationId;
            
            if (!reservationId) return;

            const name = document.getElementById('editName').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const time = document.getElementById('editTime').value;
            const partySize = parseInt(document.getElementById('editPartySize').value);
            const notes = document.getElementById('editNotes').value;
            const status = document.getElementById('editStatus').value;
            const selectedTables = Array.from(document.getElementById('editTables').selectedOptions).map(opt => opt.value);

            try {
                const res = await api('/.netlify/functions/update-reservation', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: reservationId,
                        name: name,
                        phone: phone,
                        time: time,
                        party_size: partySize,
                        notes: notes,
                        status: status,
                        table_ids: selectedTables.length > 0 ? selectedTables : undefined
                    })
                });

                if (!res) return;

                const data = await res.json();
                if (data.success) {
                    alert('Reservation updated successfully');
                    closeReservationModal();
                    loadFloorPlan();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function cancelReservation() {
            const modal = document.getElementById('reservationModal');
            const reservationId = modal.dataset.reservationId;
            
            if (!reservationId) return;
            
            if (!confirm('Are you sure you want to cancel this reservation? This will release all table assignments.')) return;

            try {
                const res = await api('/.netlify/functions/cancel-reservation', {
                    method: 'POST',
                    body: JSON.stringify({ id: reservationId })
                });

                if (!res) return;

                const data = await res.json();
                if (data.success) {
                    alert('Reservation cancelled successfully');
                    closeReservationModal();
                    loadFloorPlan();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function closeReservationModal() {
            document.getElementById('reservationModal').classList.remove('active');
        }

        // Quick Add Functions
        function openQuickAddModal() {
            const date = document.getElementById('selectedDate').value;
            document.getElementById('quickAddDate').value = date;
            document.getElementById('quickAddModal').classList.add('active');
        }

        function closeQuickAddModal() {
            document.getElementById('quickAddModal').classList.remove('active');
            // Reset form
            document.getElementById('quickAddName').value = '';
            document.getElementById('quickAddPhone').value = '';
            document.getElementById('quickAddEmail').value = '';
            document.getElementById('quickAddNotes').value = '';
            document.getElementById('quickAddPartySize').value = '';
        }

        async function saveQuickAddReservation() {
            const name = document.getElementById('quickAddName').value.trim();
            const phone = document.getElementById('quickAddPhone').value.trim();
            const email = document.getElementById('quickAddEmail').value.trim();
            const date = document.getElementById('quickAddDate').value;
            const time = document.getElementById('quickAddTime').value;
            const partySize = parseInt(document.getElementById('quickAddPartySize').value);
            const source = document.getElementById('quickAddSource').value;
            const notes = document.getElementById('quickAddNotes').value.trim();

            if (!name || !phone || !date || !time || !partySize) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const res = await api('/.netlify/functions/send-reservation', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name,
                        full_name: name,
                        phone: phone,
                        email: email || 'hostess@solomonslanding.com.mx',
                        date: date,
                        time: time,
                        party_size: partySize,
                        source: source,
                        notes: notes
                    })
                });

                if (!res) return;

                const data = await res.json();
                if (data.success) {
                    alert('Reservation created successfully');
                    closeQuickAddModal();
                    loadFloorPlan();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Initialize
        loadFloorPlan();
    </script>
</body>
</html>
