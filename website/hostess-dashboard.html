<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostess Dashboard - Solomon's Landing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1e293b;
        }
        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .dashboard-header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header h1 {
            color: #004A9F;
            font-size: 1.75rem;
        }
        .btn-logout {
            padding: 0.75rem 1.5rem;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-logout:hover { background: #b91c1c; }
        .controls-section {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls-row label {
            font-weight: 600;
            color: #374151;
        }
        .controls-row input,
        .controls-row select {
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .area-tabs {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .area-tab {
            padding: 0.75rem 1.5rem;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: #6b7280;
        }
        .area-tab.active {
            background: #004A9F;
            color: white;
        }
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 1200px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
        }
        .floor-plan-container {
            position: relative;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f9fafb;
            min-height: 600px;
            overflow: auto;
        }
        .floor-plan-canvas {
            position: relative;
            width: 100%;
            height: 600px;
            background: white;
        }
        .table-element {
            position: absolute;
            border: 3px solid;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
            transition: all 0.2s;
        }
        .table-element:hover {
            transform: scale(1.05);
            z-index: 100;
        }
        .table-element.available {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }
        .table-element.reserved {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
        }
        .table-element.blocked {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }
        .table-element.unavailable {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }
        .status-legend {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid;
        }
        .legend-color.available {
            background: #d1fae5;
            border-color: #10b981;
        }
        .legend-color.reserved {
            background: #dbeafe;
            border-color: #3b82f6;
        }
        .legend-color.blocked {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        .legend-color.unavailable {
            background: #fee2e2;
            border-color: #ef4444;
        }
        .reservations-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .reservation-item,
        .block-item {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .reservation-name {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .reservation-details {
            font-size: 0.9rem;
            color: #6b7280;
        }
        .reservation-table {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #004A9F;
            font-weight: 600;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn-primary {
            padding: 0.75rem 1.5rem;
            background: #004A9F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-primary:hover { background: #003d82; }
        .btn-secondary {
            padding: 0.75rem 1.5rem;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-secondary:hover { background: #4b5563; }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>🍽️ Hostess Dashboard</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="controls-section">
            <div class="controls-row">
                <label>Date:</label>
                <input type="date" id="selectedDate" onchange="loadFloorPlan()">
                <label>Time:</label>
                <select id="selectedTime" onchange="loadFloorPlan()">
                    <option value="17:30">5:30 PM</option>
                    <option value="18:00">6:00 PM</option>
                    <option value="18:30">6:30 PM</option>
                    <option value="19:00">7:00 PM</option>
                    <option value="19:30">7:30 PM</option>
                    <option value="20:00">8:00 PM</option>
                    <option value="20:30">8:30 PM</option>
                    <option value="21:00">9:00 PM</option>
                    <option value="21:30">9:30 PM</option>
                </select>
            </div>
            <div class="area-tabs">
                <button class="area-tab active" onclick="switchArea('Main Floor')">Main Floor</button>
                <button class="area-tab" onclick="switchArea('Sushi Bar')">Sushi Bar</button>
            </div>
        </div>

        <div class="main-content">
            <!-- LEFT: Floor Plan -->
            <div class="section">
                <h2>Floor Plan</h2>
                <div class="status-legend">
                    <div class="legend-item">
                        <div class="legend-color available"></div>
                        <span>Available</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color reserved"></div>
                        <span>Reserved</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color blocked"></div>
                        <span>Blocked</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color unavailable"></div>
                        <span>Unavailable</span>
                    </div>
                </div>
                <div class="floor-plan-container">
                    <div id="floorPlanCanvas" class="floor-plan-canvas">
                        <div class="loading">Loading floor plan...</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Reservations & Blocks -->
            <div class="section">
                <h2>Reservations & Blocks</h2>
                <div id="reservationsList" class="reservations-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Action Modal -->
    <div id="tableModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Table Actions</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        const role = sessionStorage.getItem('dashboardRole');
        const token = sessionStorage.getItem('dashboardAuthToken');
        
        if (!role || !token || (role !== 'hostess' && role !== 'admin')) {
            alert('Unauthorized. Redirecting to login...');
            window.location.href = '/index.html';
        }

        // API helper
        async function api(path, opts = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...(opts.headers || {})
            };
            
            const response = await fetch(path, {
                ...opts,
                headers
            });
            
            if (response.status === 401) {
                alert('Session expired. Please login again.');
                logout();
                return null;
            }
            
            return response;
        }

        function logout() {
            sessionStorage.removeItem('dashboardRole');
            sessionStorage.removeItem('dashboardAuthToken');
            sessionStorage.removeItem('dashboardUsername');
            window.location.href = '/index.html';
        }

        // State
        let currentArea = 'Main Floor';
        let allTables = [];
        let currentLayout = [];
        let assignments = [];
        let reservations = [];
        let selectedTableId = null;

        // Initialize
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('selectedDate').value = today;
        document.getElementById('selectedTime').value = '19:00';

        function switchArea(area) {
            currentArea = area;
            document.querySelectorAll('.area-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === area) tab.classList.add('active');
            });
            loadFloorPlan();
        }

        async function loadFloorPlan() {
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            if (!date || !time) return;
            
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '<div class="loading">Loading floor plan...</div>';
            
            try {
                // Load layout
                const layoutRes = await api(`/.netlify/functions/get-layout?area=${encodeURIComponent(currentArea)}`);
                if (!layoutRes) return;
                
                const layoutData = await layoutRes.json();
                currentLayout = layoutData.success && layoutData.layout?.layout_json ? layoutData.layout.layout_json : [];
                
                // Load tables
                const tablesRes = await api('/.netlify/functions/get-tables');
                if (!tablesRes) return;
                
                const tablesData = await tablesRes.json();
                allTables = (tablesData.all || []).filter(t => t.area === currentArea && t.is_active);
                
                // Load assignments for this date/time
                const assignmentsRes = await api(`/.netlify/functions/get-table-assignments?date=${date}&time=${time}`);
                if (!assignmentsRes) return;
                
                assignments = await assignmentsRes.json().catch(() => []);
                
                // Load reservations for this date
                const reservationsRes = await api(`/.netlify/functions/get-reservations?date=${date}`);
                if (!reservationsRes) return;
                
                reservations = await reservationsRes.json().catch(() => []);
                
                renderFloorPlan();
                renderReservationsList();
            } catch (error) {
                canvas.innerHTML = `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        function renderFloorPlan() {
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '';
            
            allTables.forEach(table => {
                const assignment = assignments.find(a => a.table_id === table.id);
                const status = assignment ? assignment.status : 'available';
                
                const savedPos = currentLayout.find(l => l.table_id === table.id);
                const x = savedPos?.x || 50;
                const y = savedPos?.y || 50;
                const w = savedPos?.w || (table.seats === 2 ? 60 : table.seats === 4 ? 80 : 100);
                const h = savedPos?.h || (table.seats === 2 ? 40 : table.seats === 4 ? 60 : 80);
                
                const elem = document.createElement('div');
                elem.className = `table-element ${status}`;
                elem.dataset.tableId = table.id;
                elem.style.left = `${x}px`;
                elem.style.top = `${y}px`;
                elem.style.width = `${w}px`;
                elem.style.height = `${h}px`;
                elem.textContent = table.name || `T${table.table_number}`;
                elem.title = `${table.name || `Table ${table.table_number}`} (${table.seats} seats) - ${status}`;
                
                elem.addEventListener('click', () => openTableModal(table, assignment));
                
                canvas.appendChild(elem);
            });
        }

        function renderReservationsList() {
            const container = document.getElementById('reservationsList');
            const time = document.getElementById('selectedTime').value;
            
            const timeReservations = reservations.filter(r => r.time === time);
            const timeAssignments = assignments.filter(a => a.time === time);
            const blocks = timeAssignments.filter(a => a.status === 'blocked' || a.status === 'unavailable');
            
            let html = '<h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Reservations</h3>';
            
            if (timeReservations.length === 0) {
                html += '<div class="loading">No reservations for this time slot</div>';
            } else {
                timeReservations.forEach(res => {
                    const assignment = timeAssignments.find(a => a.reservation_id === res.id);
                    html += `
                        <div class="reservation-item">
                            <div class="reservation-name">${res.name || res.full_name || 'Guest'}</div>
                            <div class="reservation-details">${res.party_size} guests • ${res.phone || 'No phone'}</div>
                            ${assignment ? `<div class="reservation-table">Table: ${assignment.table_name || assignment.table_number || 'N/A'}</div>` : '<div class="reservation-table" style="color: #dc2626;">No table assigned</div>'}
                        </div>
                    `;
                });
            }
            
            html += '<h3 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem;">Blocks</h3>';
            
            if (blocks.length === 0) {
                html += '<div class="loading">No blocks for this time slot</div>';
            } else {
                blocks.forEach(block => {
                    const table = allTables.find(t => t.id === block.table_id);
                    html += `
                        <div class="block-item">
                            <div class="reservation-name">${table?.name || `Table ${block.table_number}`}</div>
                            <div class="reservation-details">${block.status} • ${block.notes || 'No notes'}</div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
        }

        function openTableModal(table, assignment) {
            selectedTableId = table.id;
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modal = document.getElementById('tableModal');
            
            modalTitle.textContent = `${table.name || `Table ${table.table_number}`} (${table.seats} seats)`;
            
            let html = '';
            
            if (assignment) {
                html += `<div class="message">Current status: <strong>${assignment.status}</strong></div>`;
            }
            
            html += `
                <div class="form-group">
                    <label>Action:</label>
                    <select id="tableAction" onchange="updateActionForm()">
                        <option value="assign">Assign Reservation</option>
                        <option value="block">Quick Block</option>
                        <option value="unavailable">Mark Unavailable</option>
                        ${assignment ? '<option value="release">Release</option>' : ''}
                    </select>
                </div>
                <div id="actionForm"></div>
            `;
            
            modalBody.innerHTML = html;
            updateActionForm();
            modal.classList.add('active');
        }

        function updateActionForm() {
            const action = document.getElementById('tableAction').value;
            const form = document.getElementById('actionForm');
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            let html = '';
            
            if (action === 'assign') {
                const unassigned = reservations.filter(r => {
                    if (r.time !== time) return false;
                    return !assignments.some(a => a.reservation_id === r.id);
                });
                
                if (unassigned.length === 0) {
                    html = '<div class="message error">No unassigned reservations for this time slot</div>';
                } else {
                    html = `
                        <div class="form-group">
                            <label>Select Reservation:</label>
                            <select id="reservationSelect">
                                ${unassigned.map(r => `<option value="${r.id}">${r.name || r.full_name || 'Guest'} - ${r.party_size} guests</option>`).join('')}
                            </select>
                        </div>
                        <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Assign</button>
                    `;
                }
            } else if (action === 'block') {
                html = `
                    <div class="form-group">
                        <label>Reason (default: OpenTable):</label>
                        <input type="text" id="blockReason" value="OpenTable" placeholder="OpenTable">
                    </div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Block Table</button>
                `;
            } else if (action === 'unavailable') {
                html = `
                    <div class="message">Mark this table as unavailable for this time slot?</div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Mark Unavailable</button>
                `;
            } else if (action === 'release') {
                html = `
                    <div class="message">Release this table assignment?</div>
                    <button class="btn-primary" onclick="executeTableAction()" style="width: 100%;">Release</button>
                `;
            }
            
            form.innerHTML = html;
        }

        async function executeTableAction() {
            const action = document.getElementById('tableAction').value;
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            
            try {
                if (action === 'release') {
                    const assignment = assignments.find(a => a.table_id === selectedTableId && a.time === time);
                    if (!assignment) {
                        alert('No assignment found to release');
                        return;
                    }
                    
                    const res = await api('/.netlify/functions/release-assignment', {
                        method: 'POST',
                        body: JSON.stringify({ id: assignment.id })
                    });
                    
                    if (!res) return;
                    
                    const data = await res.json();
                    if (data.success) {
                        alert('Table released successfully');
                        closeModal();
                        loadFloorPlan();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                } else {
                    let payload = {
                        table_id: selectedTableId,
                        date: date,
                        time: time,
                        status: action === 'assign' ? 'reserved' : action === 'block' ? 'blocked' : 'unavailable'
                    };
                    
                    if (action === 'assign') {
                        const reservationId = document.getElementById('reservationSelect').value;
                        payload.reservation_id = reservationId;
                    }
                    
                    if (action === 'block') {
                        payload.notes = document.getElementById('blockReason').value || 'OpenTable';
                    }
                    
                    const res = await api('/.netlify/functions/set-assignment', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res) return;
                    
                    const data = await res.json();
                    if (data.success) {
                        alert('Action completed successfully');
                        closeModal();
                        loadFloorPlan();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function closeModal() {
            document.getElementById('tableModal').classList.remove('active');
            selectedTableId = null;
        }

        // Close modal on outside click
        document.getElementById('tableModal').addEventListener('click', (e) => {
            if (e.target.id === 'tableModal') closeModal();
        });

        // Initialize
        loadFloorPlan();
    </script>
</body>
</html>
