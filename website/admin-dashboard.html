<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Solomon's Landing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1e293b;
        }
        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .dashboard-header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header h1 {
            color: #004A9F;
            font-size: 1.75rem;
        }
        .btn-logout {
            padding: 0.75rem 1.5rem;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-logout:hover { background: #b91c1c; }
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 1200px) {
            .two-column { grid-template-columns: 1fr; }
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #004A9F;
        }
        .btn-primary {
            padding: 0.75rem 1.5rem;
            background: #004A9F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-primary:hover { background: #003d82; }
        .btn-secondary {
            padding: 0.5rem 1rem;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger {
            padding: 0.5rem 1rem;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-danger:hover { background: #b91c1c; }
        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .tables-list {
            max-height: 600px;
            overflow-y: auto;
        }
        .table-item {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-item.inactive {
            opacity: 0.6;
            background: #f9fafb;
        }
        .table-info {
            flex: 1;
        }
        .table-name {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .table-details {
            font-size: 0.9rem;
            color: #6b7280;
        }
        .table-actions {
            display: flex;
            gap: 0.5rem;
        }
        .area-group {
            margin-bottom: 2rem;
        }
        .area-group h3 {
            color: #004A9F;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .floor-plan-container {
            position: relative;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f9fafb;
            min-height: 520px;
            overflow: auto;
        }
        .floor-plan-canvas {
            position: relative;
            width: 100%;
            height: 520px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }
        .layout-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .layout-controls select {
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }
        .hint {
            color: #6b7280;
            font-style: italic;
            font-size: 0.9rem;
        }
        .table-node {
            position: absolute;
            user-select: none;
            cursor: grab;
            z-index: 10;
        }
        .table-node:active {
            cursor: grabbing;
        }
        .table-node.selected .table-shape {
            outline: 3px solid rgba(245, 158, 11, 0.55);
            outline-offset: 2px;
        }
        .table-shape {
            position: relative;
            width: 96px;
            height: 64px;
            border: 2px solid #1d4ed8;
            background: #eaf2ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1d4ed8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .table-shape.round {
            width: 72px;
            height: 72px;
            border-radius: 999px;
        }
        .seat {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #1d4ed8;
            opacity: 0.9;
            border: 1px solid #fff;
        }
        .table-label {
            font-size: 12px;
            margin-top: 6px;
            text-align: center;
            color: #111827;
            font-weight: 600;
        }
        .floor-plan-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }
        .area-selector {
            flex: 1;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #dc2626;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>🍽️ Admin Dashboard - Table Management</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="two-column">
            <!-- LEFT: Tables Management -->
            <div class="section">
                <h2>Tables</h2>
                <div id="messageArea"></div>
                
                <div class="form-group">
                    <label>Add New Table</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 0.5rem;">
                        <input type="number" id="newTableNumber" placeholder="Table #" min="1">
                        <select id="newTableSeats">
                            <option value="2">2 seats</option>
                            <option value="4" selected>4 seats</option>
                            <option value="6">6 seats</option>
                        </select>
                        <input type="text" id="newTableArea" placeholder="Area" list="areaList">
                        <datalist id="areaList">
                            <option value="Main Floor">
                            <option value="Sushi Bar">
                        </datalist>
                        <button class="btn-primary btn-small" onclick="addTable()">Add</button>
                    </div>
                    <input type="text" id="newTableName" placeholder="Name (optional)" style="margin-top: 0.5rem;">
                </div>

                <div id="tablesList" class="tables-list">
                    <div class="loading">Loading tables...</div>
                </div>
            </div>

            <!-- RIGHT: Floor Plan Editor -->
            <div class="section">
                <h2>Floor Plan Editor</h2>
                <div class="floor-plan-controls">
                    <select id="floorPlanArea" class="area-selector" onchange="loadFloorPlan()">
                        <option value="Main Floor">Main Floor</option>
                        <option value="Sushi Bar">Sushi Bar</option>
                    </select>
                    <button class="btn-primary" onclick="saveFloorPlan()">Save Layout</button>
                    <button class="btn-secondary" onclick="resetFloorPlan()">Reset</button>
                </div>
                <div class="layout-controls">
                    <select id="layoutTableSelect"></select>
                    <button id="btnAddToLayout" class="btn-primary" onclick="startPlacingTable()">Add Table</button>
                    <button id="btnRemoveFromLayout" class="btn-danger" onclick="removeSelectedTable()" disabled>Remove</button>
                    <span id="placeHint" class="hint" style="display:none;">Click on the canvas to place the table…</span>
                </div>
                <div class="floor-plan-container">
                    <div id="floorPlanCanvas" class="floor-plan-canvas"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        const role = sessionStorage.getItem('dashboardRole');
        const token = sessionStorage.getItem('dashboardAuthToken');
        
        if (!role || !token || role !== 'admin') {
            alert('Unauthorized. Redirecting to login...');
            window.location.href = '/index.html';
        }

        // API helper
        async function api(path, opts = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...(opts.headers || {})
            };
            
            const response = await fetch(path, {
                ...opts,
                headers
            });
            
            if (response.status === 401) {
                alert('Session expired. Please login again.');
                logout();
                return null;
            }
            
            return response;
        }

        function logout() {
            sessionStorage.removeItem('dashboardRole');
            sessionStorage.removeItem('dashboardAuthToken');
            sessionStorage.removeItem('dashboardUsername');
            window.location.href = '/index.html';
        }

        // Tables management
        let allTables = [];
        let editingTableId = null;

        async function loadTables() {
            const container = document.getElementById('tablesList');
            container.innerHTML = '<div class="loading">Loading tables...</div>';
            
            try {
                const res = await api('/.netlify/functions/get-tables');
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    allTables = data.all || [];
                    renderTables();
                } else {
                    container.innerHTML = `<div class="message error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="message error">Error loading tables: ${error.message}</div>`;
            }
        }

        function renderTables() {
            const container = document.getElementById('tablesList');
            const grouped = {};
            
            allTables.forEach(table => {
                if (!grouped[table.area]) grouped[table.area] = [];
                grouped[table.area].push(table);
            });
            
            let html = '';
            Object.keys(grouped).sort().forEach(area => {
                html += `<div class="area-group"><h3>${area}</h3>`;
                grouped[area].sort((a, b) => a.table_number - b.table_number).forEach(table => {
                    html += `
                        <div class="table-item ${table.is_active ? '' : 'inactive'}">
                            <div class="table-info">
                                <div class="table-name">${table.name || `Table ${table.table_number}`}</div>
                                <div class="table-details">#${table.table_number} • ${table.seats} seats • ${table.is_active ? 'Active' : 'Inactive'}</div>
                            </div>
                            <div class="table-actions">
                                <button class="btn-secondary btn-small" onclick="editTable('${table.id}')">Edit</button>
                                <button class="btn-secondary btn-small" onclick="toggleTableActive('${table.id}', ${!table.is_active})">${table.is_active ? 'Deactivate' : 'Activate'}</button>
                                <button class="btn-danger btn-small" onclick="deleteTable('${table.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            
            container.innerHTML = html || '<div class="loading">No tables found. Add your first table above.</div>';
        }

        async function addTable() {
            const tableNumber = parseInt(document.getElementById('newTableNumber').value);
            const seats = parseInt(document.getElementById('newTableSeats').value);
            const area = document.getElementById('newTableArea').value.trim();
            const name = document.getElementById('newTableName').value.trim() || null;
            
            if (!tableNumber || !seats || !area) {
                showMessage('Please fill in table number, seats, and area', 'error');
                return;
            }
            
            try {
                const res = await api('/.netlify/functions/upsert-table', {
                    method: 'POST',
                    body: JSON.stringify({
                        table_number: tableNumber,
                        seats: seats,
                        area: area,
                        name: name,
                        is_active: true
                    })
                });
                
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    showMessage('Table added successfully', 'success');
                    document.getElementById('newTableNumber').value = '';
                    document.getElementById('newTableName').value = '';
                    await loadTables();
                    await loadFloorPlan(); // Refresh floor plan
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function editTable(id) {
            const table = allTables.find(t => t.id === id);
            if (!table) return;
            
            const name = prompt('Table name:', table.name || `Table ${table.table_number}`);
            if (name === null) return;
            
            const seats = prompt('Seats (2, 4, or 6):', table.seats);
            if (!seats || !['2', '4', '6'].includes(seats)) {
                alert('Seats must be 2, 4, or 6');
                return;
            }
            
            const area = prompt('Area:', table.area);
            if (!area) return;
            
            try {
                const res = await api('/.netlify/functions/upsert-table', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: id,
                        table_number: table.table_number,
                        seats: parseInt(seats),
                        area: area,
                        name: name || null,
                        is_active: table.is_active
                    })
                });
                
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    showMessage('Table updated successfully', 'success');
                    await loadTables();
                    await loadFloorPlan();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function toggleTableActive(id, isActive) {
            const table = allTables.find(t => t.id === id);
            if (!table) return;
            
            try {
                const res = await api('/.netlify/functions/upsert-table', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: id,
                        table_number: table.table_number,
                        seats: table.seats,
                        area: table.area,
                        name: table.name,
                        is_active: isActive
                    })
                });
                
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    showMessage(`Table ${isActive ? 'activated' : 'deactivated'}`, 'success');
                    await loadTables();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function deleteTable(id) {
            if (!confirm('Are you sure you want to delete this table?')) return;
            
            try {
                const res = await api('/.netlify/functions/delete-table', {
                    method: 'POST',
                    body: JSON.stringify({ id: id })
                });
                
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    showMessage('Table deleted successfully', 'success');
                    await loadTables();
                    await loadFloorPlan();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function showMessage(text, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 3000);
        }

        // Floor Plan Editor
        let currentLayout = [];
        let draggedElement = null;
        let dragOffset = { x: 0, y: 0 };

        async function loadFloorPlan() {
            const area = document.getElementById('floorPlanArea').value;
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '<div class="loading">Loading floor plan...</div>';
            
            try {
                // Load layout
                const layoutRes = await api(`/.netlify/functions/get-layout?area=${encodeURIComponent(area)}`);
                if (!layoutRes) return;
                
                const layoutData = await layoutRes.json();
                currentLayout = layoutData.success && layoutData.layout?.layout_json ? layoutData.layout.layout_json : [];
                
                // Load tables for this area
                const tablesRes = await api('/.netlify/functions/get-tables');
                if (!tablesRes) return;
                
                const tablesData = await tablesRes.json();
                const areaTables = (tablesData.all || []).filter(t => t.area === area && t.is_active);
                
                renderFloorPlan(areaTables);
            } catch (error) {
                canvas.innerHTML = `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        function renderFloorPlan(tables) {
            const canvas = document.getElementById('floorPlanCanvas');
            canvas.innerHTML = '';
            
            tables.forEach(table => {
                const savedPos = currentLayout.find(l => l.table_id === table.id);
                const x = savedPos?.x || 50;
                const y = savedPos?.y || 50;
                const w = savedPos?.w || (table.seats === 2 ? 60 : table.seats === 4 ? 80 : 100);
                const h = savedPos?.h || (table.seats === 2 ? 40 : table.seats === 4 ? 60 : 80);
                
                const elem = document.createElement('div');
                elem.className = 'table-element';
                elem.dataset.tableId = table.id;
                elem.style.left = `${x}px`;
                elem.style.top = `${y}px`;
                elem.style.width = `${w}px`;
                elem.style.height = `${h}px`;
                elem.textContent = table.name || `T${table.table_number}`;
                elem.title = `${table.name || `Table ${table.table_number}`} (${table.seats} seats)`;
                
                // Drag handlers
                elem.addEventListener('mousedown', (e) => startDrag(e, elem));
                
                canvas.appendChild(elem);
            });
        }

        function startDrag(e, elem) {
            draggedElement = elem;
            const rect = elem.getBoundingClientRect();
            const canvasRect = document.getElementById('floorPlanCanvas').getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            elem.classList.add('dragging');
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            e.preventDefault();
        }

        function onDrag(e) {
            if (!draggedElement) return;
            
            const canvas = document.getElementById('floorPlanCanvas');
            const canvasRect = canvas.getBoundingClientRect();
            const x = e.clientX - canvasRect.left - dragOffset.x;
            const y = e.clientY - canvasRect.top - dragOffset.y;
            
            draggedElement.style.left = `${Math.max(0, x)}px`;
            draggedElement.style.top = `${Math.max(0, y)}px`;
        }

        function stopDrag() {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        async function saveFloorPlan() {
            const area = document.getElementById('floorPlanArea').value;
            const canvas = document.getElementById('floorPlanCanvas');
            const elements = canvas.querySelectorAll('.table-element');
            
            const layout = [];
            elements.forEach(elem => {
                const rect = elem.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                const table = allTables.find(t => t.id === elem.dataset.tableId);
                if (table) {
                    layout.push({
                        table_id: table.id,
                        x: rect.left - canvasRect.left,
                        y: rect.top - canvasRect.top,
                        w: rect.width,
                        h: rect.height
                    });
                }
            });
            
            try {
                const res = await api('/.netlify/functions/save-layout', {
                    method: 'POST',
                    body: JSON.stringify({
                        area: area,
                        layout_json: layout
                    })
                });
                
                if (!res) return;
                
                const data = await res.json();
                if (data.success) {
                    showMessage('Floor plan saved successfully', 'success');
                    currentLayout = layout;
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function resetFloorPlan() {
            if (confirm('Reset floor plan to default positions?')) {
                currentLayout = [];
                loadFloorPlan();
            }
        }

        // Initialize
        loadTables();
        loadFloorPlan();
    </script>
</body>
</html>
