<!-- RES APP PAGE: dashboard-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Login - Solomon's Landing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --brand-blue: #004A9F;
      --brand-blue-dark: #003d82;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(255,255,255,0.18);
      --card: rgba(255,255,255,0.96);
      --shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* ✅ SOLID BLUE BACKGROUND */
      background: var(--brand-blue);

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle premium lighting (still solid base color) */
    body::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        radial-gradient(closest-side, rgba(255,255,255,0.18), rgba(255,255,255,0) 60%),
        radial-gradient(closest-side, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%);
      transform: translate(10%, -10%);
      pointer-events:none;
      filter: blur(10px);
    }
    body::after{
      content:"";
      position:absolute;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      right: -220px;
      bottom: -220px;
      filter: blur(2px);
      pointer-events:none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 28px 28px 22px;
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(10px);

      transform: translateY(10px);
      opacity: 0;
      animation: popIn 520ms ease-out forwards;
      position: relative;
      z-index: 1;
    }

    @keyframes popIn{
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo img {
      max-width: 240px;
      height: auto;
      display: block;
      /* Helps white logo pop on light card (subtle glow) */
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.18));
    }

    h1 {
      color: var(--text);
      font-size: 1.75rem;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.96rem;
      line-height: 1.35;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.95rem 0.95rem;
      border: 1px solid rgba(15,23,42,0.12);
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.08s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(0,74,159,0.45);
      box-shadow: 0 0 0 6px rgba(0,74,159,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(180deg, var(--brand-blue), #003b7d);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.18s ease;
      margin-top: 6px;
      box-shadow: 0 14px 30px rgba(0,74,159,0.35);
    }

    .btn-login:hover { filter: brightness(1.05); }
    .btn-login:active { transform: translateY(1px); }

    .error-message {
      color: #b91c1c;
      margin-top: 12px;
      font-size: 0.92rem;
      display: none;
      padding: 10px 12px;
      background: rgba(185,28,28,0.08);
      border: 1px solid rgba(185,28,28,0.18);
      border-radius: 12px;
    }
    .error-message.show { display: block; }

    /* Small footer hint without the ugly roles box */
    .micro-hint{
      margin-top: 14px;
      font-size: 0.82rem;
      color: rgba(100,116,139,0.9);
      text-align: center;
    }

    /* Mobile polish */
    @media (max-width: 420px){
      body{ padding: 18px; }
      .login-container{ padding: 24px 20px 18px; border-radius: 16px; }
      .logo img{ max-width: 220px; }
    }

    /* Build Badge - Cursor Build Marker */
    .build-badge {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.92);
      color: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 10px;
      font-weight: 600;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      z-index: 9999;
      pointer-events: none;
      line-height: 1.3;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }
    @media (max-width: 420px) {
      .build-badge {
        font-size: 9px;
        padding: 5px 10px;
        bottom: 8px;
        right: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">
      <!-- ✅ Use your exact logo URL -->
      <img
        src="https://res.cloudinary.com/dpmozdkfh/image/upload/v1765665392/logo_qykwcx.jpg"
        alt="Solomon's Landing"
      />
    </div>

    <h1>Dashboard Login</h1>
    <p>Access the reservation management system</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="hostess or admin"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login">Login (Cursor ✅)</button>
      <div id="errorMessage" class="error-message"></div>
    </form>

    <!-- ✅ Removed the Roles block completely -->
    <!-- Deploy: 2025-01-07 -->
    <div class="micro-hint">Solomon's Landing • Reservation System</div>
  </div>

  <script>
    // Check if already logged in
    const role = sessionStorage.getItem("dashboardRole");
    const token = sessionStorage.getItem("dashboardAuthToken");

    if (role && token) {
      // Redirect to appropriate dashboard
      if (role === "admin") {
        window.location.href = "admin-dashboard.html";
      } else if (role === "hostess" || role === "admin") {
        window.location.href = "hostess-dashboard.html";
      }
    }

    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("errorMessage");
      const PASSWORD = "solomons2025";

      // Clear previous errors
      errorDiv.classList.remove("show");
      errorDiv.textContent = "";

      // Validate password
      if (password !== PASSWORD) {
        errorDiv.textContent = "Incorrect password";
        errorDiv.classList.add("show");
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
        return;
      }

      // Route based on username
      let dashboardUrl = null;
      let role = null;

      if (username === "hostess") {
        dashboardUrl = "hostess-dashboard.html";
        role = "hostess";
      } else if (username === "admin") {
        dashboardUrl = "admin-dashboard.html";
        role = "admin";
      } else {
        errorDiv.textContent = 'Invalid username. Use "hostess" or "admin"';
        errorDiv.classList.add("show");
        document.getElementById("username").value = "";
        document.getElementById("username").focus();
        return;
      }

      // Store session
      const authToken = btoa(`${username}:${password}:${Date.now()}`);
      sessionStorage.setItem("dashboardRole", role);
      sessionStorage.setItem("dashboardAuthToken", authToken);
      sessionStorage.setItem("dashboardUsername", username);

      // Redirect
      window.location.href = dashboardUrl;
    }

    // Allow Enter key to submit
    document.getElementById("password").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        document.getElementById("loginForm").dispatchEvent(new Event("submit"));
      }
    });

    // Build Badge - Cursor Build Marker
    (function() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const dateTimeStr = `${year}-${month}-${day} ${hours}:${minutes}`;
      const badge = document.createElement('div');
      badge.className = 'build-badge';
      badge.innerHTML = `RES APP BUILD ✅ ${dateTimeStr}`;
      document.body.appendChild(badge);
    })();
  </script>
</body>
</html>
